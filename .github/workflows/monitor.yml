name: Yetimall Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # 更新到 v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 # 更新到 v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright requests pandas
          playwright install chromium
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 檢查檔案是否存在
          if [ -f "sales_records.csv" ]; then
            git add sales_records.csv
            git commit -m "Update sales data [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "CSV file was not created by monitor.py. Check monitor.py logs."
          fi
