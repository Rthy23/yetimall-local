name: Yetimall Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 重要：必須顯式聲明寫入權限
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright requests pandas
          playwright install chromium
          
      - name: Run Monitor
        run: python monitor.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 先設定遠端連結
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          if [ -f "sales_records.csv" ]; then
            git add sales_records.csv
            # 強制同步，確保不發生衝突
            git pull --rebase origin main
            git commit -m "Update sales data [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            echo "CSV file was not created by monitor.py. Skipping commit."
          fi
