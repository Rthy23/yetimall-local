name: Yetimall Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # 更新到 v4
      
      - name: Set up Python
        uses: actions/setup-python@v5 # 更新到 v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright requests pandas
          playwright install chromium
          
      - name: Run Monitor
        run: python monitor.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # 檢查檔案是否真的產生了
          if [ -f "sales_records.csv" ]; then
            git add sales_records.csv
            git commit -m "Update sales data"
            git push
          else
            echo "CSV file was not created by monitor.py. Check monitor.py logs."
          fi
          
            git push
          else
            echo "No CSV file generated this time, skipping commit."
          fi
