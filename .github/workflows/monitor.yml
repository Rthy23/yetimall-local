name: Yetimall Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # 設定每 5 分鐘執行一次
  workflow_dispatch:      # 允許你在 GitHub 頁面手動點擊執行

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright requests pandas
          playwright install chromium
          
      - name: Run Monitor
        run: python monitor.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # 檢查 CSV 是否存在，存在才進行提交，避免因檔案不存在而報錯
          if [ -f "sales_records.csv" ]; then
            git add sales_records.csv
            git commit -m "Update sales data [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "No CSV file generated this time, skipping commit."
          fi
