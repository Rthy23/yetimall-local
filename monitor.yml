name: Yetimall Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: yetimall-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright requests pandas
          playwright install chromium
          
      - name: Run Monitor
        run: python monitor.py
        
      - name: Commit and push changes
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if [ ! -f "sales_records.csv" ]; then
            echo "CSV file was not created. Skipping commit."
            exit 0
          fi
          
          git add sales_records.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update sales data [skip ci]"
          
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "$BRANCH" && exit 0
            echo "Push rejected, retry $i/3..."
            sleep 5
          done
          echo "Push failed after 3 retries"
          exit 1
